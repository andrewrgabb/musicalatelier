[project]
name = "musical-atelier-worker"
version = "0.1.0"
description = "Python worker — consumes the BullMQ transcription queue and runs the OMR engine."
requires-python = ">=3.10"
dependencies = [
    # The Python port of BullMQ. Interoperable with the Node producer because
    # both speak the same Redis Lua scripts on the same queue.
    "bullmq>=2.0.0",
    # Loads the repo-root .env in local dev (prod uses real env vars).
    "python-dotenv>=1.0.0",
    # S3 client for downloading the source and uploading the MusicXML
    # (points at MinIO locally, R2 in prod).
    "boto3>=1.34.0",
    # Async Postgres client — the worker mirrors job status into the scores row.
    "asyncpg>=0.29.0",
]

# homr (the real OMR engine) is added in Phase 6. Phase 5 uses a stub engine so
# we can prove the whole pipeline without the slow, heavy ML toolchain.

[tool.uv]
# uv manages an isolated virtualenv in apps/worker/.venv automatically.
package = false
