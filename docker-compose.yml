# =============================================================================
# Local backing services for Musical Atelier.
#
# In our HYBRID dev model this file runs ONLY the infrastructure:
#   - postgres : the database (local stand-in for Fly Managed Postgres)
#   - redis    : the BullMQ queue (local stand-in for Fly/Upstash Redis)
#   - minio    : S3-compatible object storage (local stand-in for Cloudflare R2)
#   - createbuckets : a one-shot helper that creates the MinIO bucket on startup
#
# You run the API (Node) and worker (Python) directly on your machine for fast
# hot-reload:  `pnpm infra:up`  then  `pnpm dev`  (API)  and the worker.
#
# Each managed cloud service we chose is an open standard, so the local
# counterpart is the REAL software — not an emulator. Only endpoints +
# credentials change between local and prod (see .env.example).
#
# (The full "clone-and-run everything in containers" path — including api +
#  worker images — is added in Phase 8 behind a compose profile.)
# =============================================================================

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: musical_atelier
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d musical_atelier"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000" # S3 API  (the app talks here)
      - "9001:9001" # Web console (browse buckets at http://localhost:9001)
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: waits for MinIO, then creates the bucket if it doesn't exist.
  createbuckets:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/musical-atelier &&
      echo 'Bucket musical-atelier ready.';
      "

volumes:
  postgres_data:
  redis_data:
  minio_data:
